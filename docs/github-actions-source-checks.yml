name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/audit_public_release.py
      - run: python -m compileall -q poke_bot scripts tests
      - run: python -m ruff check scripts/audit_public_release.py
      - run: python -m pytest -q tests/test_public_release_smoke.py
      - name: Reject release artifacts
        run: |
          if find . -type f \( -name '*.pt' -o -name '*.pth' -o -name '*.ckpt' -o -name '*.features' -o -name '*.whl' \) -print -quit | grep -q .; then
            echo 'release artifact found in source tree' >&2
            exit 1
          fi
