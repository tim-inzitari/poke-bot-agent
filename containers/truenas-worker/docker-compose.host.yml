# Alternate compose for a host with nvidia-container-toolkit. Keep safety
# settings identical to docker-compose.yml; only GPU attachment differs.

name: poke-bot-truenas-worker

services:
  worker:
    image: poke-bot-truenas-worker:safety-20260719.7-portable-baselines
    container_name: poke-bot-truenas-worker
    init: true
    restart: "no"
    stop_grace_period: 90s
    ports:
      - "8765:8765"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      POKEBOT_WORKER_CPU_ONLY: "1"
      POKEBOT_REMOTE_WORKER_ARM_FILE: /workspace/runtime-logs/REMOTE_WORKER_ARMED
      POKEBOT_WORKER_RECYCLE_GAMES: "16"
      WORKER_RECYCLE_GAMES: "16"
      POKEBOT_REMOTE_MAX_SERVICE_JOBS: "100"
      POKEBOT_REMOTE_TREE_RSS_LIMIT_GB: "52"
      POKEBOT_REMOTE_MIN_FREE_RAM_GB: "24"
      # Keep control/health capacity outside the 12 advertised game sockets.
      # Without this reserve, a fully busy worker falsely becomes unhealthy.
      POKEBOT_REMOTE_MAX_CONNECTIONS: "16"
      POKEBOT_REMOTE_WATCHDOG_INTERVAL_S: "5"
      # A maxtasksperchild recycle briefly reduces ready capacity while its
      # replacement completes the native-runtime and leaf-slot initializer.
      POKEBOT_REMOTE_WORKER_CAPACITY_RECOVERY_GRACE_S: "60"
      POKEBOT_PRIMARY_ARCHETYPE: hammer-pult
      POKEBOT_CHECKPOINT: /workspace/checkpoint/model.pt
      CG_LIB_PATH: /workspace/kaggle/input/cg-lib
      SIM_WORKERS: "${ELMO_SIM_WORKERS:-4}"
      SIM_DEFAULT_WORKERS: "${ELMO_SIM_DEFAULT_WORKERS:-4}"
      ELMO_SIM_WORKER_CEILING: "40"
      LEAF_SERVERS: "2"
      LEAF_GPU: cuda:0
      LEAF_MAX_BATCH: "192"
      LEAF_QUEUE_DEPTH: "96"
      LEAF_COALESCE_MS: "2"
      REMOTE_JOB_PORT: "8765"
      POKEBOT_OPENING_MOVE_TIME_MULT: "1.0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${POKEBOT_CHECKPOINT_HOST:-./checkpoint}:/workspace/checkpoint:ro
      - ${POKEBOT_RUNTIME_HOST:-./runtime-logs}:/workspace/runtime-logs
    shm_size: "2gb"
    cpus: 24
    mem_limit: 64g
    memswap_limit: 64g
    pids_limit: 768
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Compose 2.32 implements the spec's list form; the later ``gpus: all``
    # shorthand is rejected by the TrueNAS host parser.
    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os;
          from poke_bot.remote_jobs import RemoteJobClient;
          c=RemoteJobClient('127.0.0.1', int(os.environ.get('REMOTE_JOB_PORT','8765')), timeout_s=5, connect_timeout_s=5, control_timeout_s=8);
          i=c.connect(); h=c.health(); c.close();
          assert i.workers == int(os.environ['SIM_DEFAULT_WORKERS']), (i.workers, os.environ['SIM_DEFAULT_WORKERS']);
          assert 0 < (i.max_workers or i.workers) <= int(os.environ['ELMO_SIM_WORKER_CEILING']), (i.max_workers, i.workers);
          assert {'greedy_play_v1','active_checkpoint_job_barrier_v1','play_result_contract_v1','portable_baseline_spec_v1'} <= set(i.capabilities), i.capabilities;
          assert 'checkpoint_digest_verify_v1' in set(i.capabilities), i.capabilities;
          assert h.get('ok') is True and h.get('controller_healthy') is True and h.get('leaf_alive') is True and h.get('leaf_identity_ok') is True, h
      interval: 60s
      timeout: 12s
      retries: 3
      start_period: 180s
