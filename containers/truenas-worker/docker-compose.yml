# TrueNAS SCALE Custom App / docker compose for poke-bot remote worker.
#
# Hardware target (TrueNAS Incus instance elmo):
#   AMD Ryzen 9 5900X (12c/24t) — use 20 SIM workers (leave ~4t for leaf+OS)
#   ~64 GiB free RAM — cap container at 56g
#   NVIDIA GeForce RTX 3060 Lite Hash Rate (GA106, 12 GB) — 2 leaf replicas, max_batch=192
#
# Leaf inference stays on the 3060 so LAN only carries whole-game jobs.
#
# Prerequisites on TrueNAS SCALE:
#   1. NVIDIA driver + GPU passthrough enabled for Apps
#   2. Image loaded: poke-bot-truenas-worker:latest
#   3. Checkpoint bind-mounted at /workspace/checkpoint/model.pt
#   4. Port 8765 published to LAN (training box 192.168.1.151)

name: poke-bot-truenas-worker

services:
  worker:
    image: poke-bot-truenas-worker:latest
    container_name: poke-bot-truenas-worker
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      POKEBOT_WORKER_CPU_ONLY: "1"
      POKEBOT_PRIMARY_ARCHETYPE: hammer-pult
      POKEBOT_CHECKPOINT: /workspace/checkpoint/model.pt
      CG_LIB_PATH: /workspace/kaggle/input/cg-lib
      SIM_WORKERS: "20"
      LEAF_SERVERS: "2"
      LEAF_GPU: cuda:0
      LEAF_MAX_BATCH: "192"
      LEAF_QUEUE_DEPTH: "96"
      LEAF_COALESCE_MS: "2"
      REMOTE_JOB_PORT: "8765"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Host paths are TrueNAS dataset paths — adjust after SSH/API access.
      # Default staging share: /mnt/<pool>/main/poke-bot-agent/...
      - ${POKEBOT_CHECKPOINT_HOST:-./checkpoint}:/workspace/checkpoint:ro
      - ${POKEBOT_RUNTIME_HOST:-./runtime-logs}:/workspace/runtime-logs
    shm_size: "2gb"
    cpus: 20
    mem_limit: 56g
    # elmo is nested Docker without nvidia-container-toolkit; pass host GPU
    # char devices already present in the Incus instance.
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    # Prefer devices when `gpus: all` / nvidia toolkit is unavailable inside Incus.
    # gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    # No deploy.nvidia reservation here — elmo nested Docker has /dev/nvidia*
    # but not nvidia-container-toolkit. Use `devices:` above instead.
