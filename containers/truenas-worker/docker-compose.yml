# TrueNAS SCALE host Docker / nested compose for poke-bot remote worker.
#
# Hardware target (TrueNAS / elmo path):
#   AMD Ryzen 9 5900X (12c/24t) — use 20 SIM workers (leave ~4t for leaf+OS)
#   ~64 GiB free RAM — cap container at 56g
#   NVIDIA GeForce RTX 3060 Lite Hash Rate (GA106, 12 GB) — 2 leaf replicas, max_batch=192
#
# Leaf inference stays on the 3060 so LAN only carries whole-game jobs.
# Current production note: worker listens on TrueNAS host Docker 192.168.1.143:8765
# (nested Docker inside Incus elmo is blocked by userns — see OPS.md).
#
# Prerequisites:
#   1. NVIDIA driver + GPU devices available to Docker
#   2. Image loaded: poke-bot-truenas-worker:latest
#   3. Checkpoint bind-mounted at /workspace/checkpoint/model.pt
#   4. Port 8765 published to LAN (training box)

name: poke-bot-truenas-worker

services:
  worker:
    image: poke-bot-truenas-worker:latest
    container_name: poke-bot-truenas-worker
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      POKEBOT_WORKER_CPU_ONLY: "1"
      POKEBOT_PRIMARY_ARCHETYPE: hammer-pult
      POKEBOT_CHECKPOINT: /workspace/checkpoint/model.pt
      # Prefer competition cg when baked into image; override for fork cutover:
      #   CG_LIB_PATH=/workspace/libcg_fork   (bind-mount below)
      CG_LIB_PATH: ${CG_LIB_PATH:-/workspace/kaggle/input/cg-lib}
      SIM_WORKERS: "20"
      LEAF_SERVERS: "2"
      LEAF_GPU: cuda:0
      LEAF_MAX_BATCH: "192"
      LEAF_QUEUE_DEPTH: "96"
      LEAF_COALESCE_MS: "2"
      REMOTE_JOB_PORT: "8765"
      # MultiEnv wiring (Python LibcgMultiEnv); host trainer must match.
      POKEBOT_MULTI_ENV: "${POKEBOT_MULTI_ENV:-1}"
      POKEBOT_MULTI_ENV_PER_WORKER: "${POKEBOT_MULTI_ENV_PER_WORKER:-4}"
      # Full opening move budget (0.5x caused TrustedSearchBudgetExhausted @ 6s vs 128 sims)
      POKEBOT_OPENING_MOVE_TIME_MULT: "1.0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Host paths are TrueNAS dataset paths — adjust after SSH/API access.
      # Default staging share: /mnt/<pool>/main/poke-bot-agent/...
      - ${POKEBOT_CHECKPOINT_HOST:-./checkpoint}:/workspace/checkpoint:ro
      - ${POKEBOT_RUNTIME_HOST:-./runtime-logs}:/workspace/runtime-logs
      # Optional faster libcg fork (dir containing cg/ OR the cg/ dir itself).
      # Set LIBCG_FORK_HOST on the TrueNAS host when cutting over:
      #   LIBCG_FORK_HOST=./libcg_fork CG_LIB_PATH=/workspace/libcg_fork
      - ${LIBCG_FORK_HOST:-./libcg_fork}:/workspace/libcg_fork:ro
    shm_size: "2gb"
    cpus: 20
    mem_limit: 56g
    # elmo nested Docker without nvidia-container-toolkit; pass host GPU
    # char devices. On TrueNAS host Docker, `gpus: all` also works if toolkit
    # is installed — keep devices: for the common path.
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    # gpus: all
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
