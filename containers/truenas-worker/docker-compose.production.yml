# Production lifecycle override for the passed Elmo canary.
#
# Apply this on top of exactly one canary/base GPU attachment file:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml ...
# or, on a nvidia-container-toolkit host:
#   docker compose -f docker-compose.host.yml -f docker-compose.production.yml ...
#
# The in-container supervisor still recognizes reserved exit 75 for rollback
# compatibility, but routine job-count rotation is disabled. All actual exits
# consume a durable failure slot. Twenty failures in one hour open the circuit
# with exit 0, so this outer policy cannot restart it. The outer cap exists
# only for supervisor/container faults.

name: poke-bot-truenas-worker

services:
  worker:
    image: ${POKEBOT_ELMO_IMAGE:-poke-bot-truenas-worker:r125-checkpoint-digest-verify-v2}
    command: ["production"]
    restart: "on-failure:3"
    init: true
    stop_grace_period: 90s
    environment:
      # Elmo's Ryzen 9 5900X may use all 24 logical CPUs. GPU-blocked games can
      # safely oversubscribe CPU threads. The measured 36-worker topology keeps
      # the RTX 3060 fed while preserving capacity for child replacement. Four
      # CUDA leaves use the available GPU headroom without adding simulators to
      # the already oversubscribed CPU.
      SIM_WORKERS: "36"
      SIM_DEFAULT_WORKERS: "36"
      ELMO_SIM_WORKER_CEILING: "48"
      POKEBOT_REMOTE_MAX_CONNECTIONS: "420"
      LEAF_SERVERS: "4"
      LEAF_MAX_BATCH: "256"

      # Per-child recycling every 16 games kept multiple replacements
      # initializing continuously and tripped the exact-capacity watchdog.
      # Retain per-child recycling, but do not rotate the complete endpoint by
      # job count. Whole-service rotation tears down every live trainer socket
      # and creates a long CLOSE-WAIT/reconnect trough. The independent 45 GiB
      # cgroup-charged-memory guard, host-free-RAM guard, and worker-capacity
      # watchdog remain the fail-closed memory protections.
      POKEBOT_WORKER_RECYCLE_GAMES: "256"
      WORKER_RECYCLE_GAMES: "256"
      POKEBOT_REMOTE_MAX_SERVICE_JOBS: "0"
      POKEBOT_REMOTE_PLANNED_ROTATION_EXIT_CODE: "75"

      # The legacy variable name is wire-compatible, but the audited worker
      # applies this 45 GiB threshold to cgroup-v2 memory.current (PSS fallback)
      # rather than summed descendant RSS, which double-counts shared spawn
      # pages. The outer cgroup is 64 GiB/no-swap, and the host-free guard
      # remains an independent stop.
      # The 36-worker H10 runtime reached 30.01 GiB while the host still had
      # about 55 GiB available. Allow the measured working set to settle while
      # retaining both the 24 GiB host-free floor and 64 GiB no-swap cgroup.
      POKEBOT_REMOTE_TREE_RSS_LIMIT_GB: "45"
      POKEBOT_REMOTE_MIN_FREE_RAM_GB: "24"
      POKEBOT_REMOTE_WATCHDOG_INTERVAL_S: "5"
      # Under 48-way load a recycled libcg child has taken slightly over one
      # minute to initialize. Keep serving with the healthy capacity while the
      # pool heals instead of killing the entire endpoint at 60.0 seconds.
      POKEBOT_REMOTE_WORKER_CAPACITY_RECOVERY_GRACE_S: "300"
      POKEBOT_REMOTE_WORKER_MIN_READY_FRAC: "0.80"

      # Unexpected exits or recovered unclean container attempts in an hour
      # open a durable circuit under the runtime-logs bind mount.
      POKEBOT_ELMO_SUPERVISOR_STATE_DIR: /workspace/runtime-logs/elmo-supervisor
      # The worker's memory, RSS, identity, and host-free guards remain hard.
      # A transient child-capacity exit should self-heal rather than opening a
      # clean-exit Docker circuit after only three attempts during a long run.
      POKEBOT_ELMO_RESTART_LIMIT: "20"
      POKEBOT_ELMO_RESTART_WINDOW_S: "3600"
      POKEBOT_ELMO_FAILURE_BACKOFF_S: "30"
      POKEBOT_ELMO_ROTATION_DELAY_S: "10"
      POKEBOT_ELMO_MIN_ROTATION_RUNTIME_S: "60"
      POKEBOT_ELMO_CHILD_STOP_GRACE_S: "75"

      # A successful trainer reload publishes this record atomically. Every
      # production lifetime validates it and loads its exact digest instead of
      # falling back to the original model.pt after a planned rotation.
      POKEBOT_REMOTE_ACTIVE_CHECKPOINT_FILE: /workspace/runtime-logs/elmo-supervisor/active-checkpoint.json
      POKEBOT_REMOTE_CHECKPOINT_ROOT: /workspace/checkpoint

    # Repeat the base limits here so production review cannot silently lose
    # them if the base file is reorganized. Equal caps disable container swap.
    mem_limit: 64g
    memswap_limit: 64g
    # Request handlers plus 36 simulators, two leaves, and recycle overlap need
    # headroom beyond the former 768-thread ceiling.
    pids_limit: 1536
    volumes:
      # Keep the audited production guard contract host-managed so an
      # allowance-only safety update does not require rebuilding the complete
      # immutable H10 runtime image.
      - /mnt/Main/main/poke-bot-agent/deployments/persistent-workers-20260720-v1/containers/truenas-worker/entrypoint.sh:/entrypoint.sh:ro
      - /mnt/Main/Elmo/poke-bot-agent/containers/truenas-worker/checkpoint:/workspace/checkpoint:ro
      - /mnt/Main/Elmo/poke-bot-agent/containers/truenas-worker/runtime-logs:/workspace/runtime-logs
      # Frozen-specialist packages are runtime data, not image-local state.
      # Keeping them on the host prevents a routine container recreation from
      # silently reverting to the public-only manifest baked into the image.
      - /mnt/Main/Elmo/poke-bot-agent/containers/truenas-worker/baseline-sync/manifest.json:/workspace/baselines/manifest.json:ro
      - /mnt/Main/Elmo/poke-bot-agent/containers/truenas-worker/baseline-sync/specialists:/workspace/baselines/specialists:ro
