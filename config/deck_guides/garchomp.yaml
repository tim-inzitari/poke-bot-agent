high_confidence_principles:
  - establish_redundant_visible_Cynthias_Gible_lines_before_optional_support
  - preserve_and_use_visible_Cynthias_Gabite_Champion_Call_before_evolving_it
  - add_Cynthias_Roserade_only_for_exact_current_damage_thresholds
  - prefer_Corkscrew_Dive_when_it_takes_the_same_current_prizes_as_Draconic_Buster
  - use_Draconic_Buster_for_an_exact_current_knockout_not_for_raw_damage_alone
  - use_Cynthias_Spiritomb_only_from_exact_current_benched_damage

causal_heuristic_contract:
  schema_version: poke_bot.causal_deck_guide_heuristics/v1
  stage_completeness_rule: score_every_supplied_legal_combo_or_mask_entire_stage
  minimum_preference_margin: 0.25
  supported_predicates:
    - id: initial_setup_gible_redundancy
      supported_stages:
        - initial_setup
        - exact_basic_search_prompt
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - own_public_discard_card_ids
        - current_combo_card_ids
      preference:
        prefer_Cynthias_Gible_until_two_visible_lines_exist
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
        - visible_Gible_line_count_ambiguous

    - id: visible_gabite_evolution_and_champion_call
      supported_stages:
        - legal_evolution_action
        - exact_Champion_Call_search_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - own_public_discard_card_ids
        - current_combo_card_ids
      preference:
        fill_an_exact_visible_Gible_to_Gabite_or_Gabite_to_Garchomp_gap_while_preserving_an_available_Champion_Call
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - hidden_hand_or_deck_contents_required
        - multiple_visible_gaps_have_no_exact_ordering
        - any_legal_option_unresolved

    - id: exact_roserade_immediate_damage_threshold
      supported_stages:
        - legal_evolution_action
      exact_inputs:
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - opponent_active_card_id
        - opponent_active_current_hp
        - exact_engine_current_attack_damage_before_new_Roserade
        - exact_current_attack_legality
      preference:
        prefer_Cynthias_Roserade_only_when_plus_30_crosses_an_exact_immediate_active_knockout_threshold
      abstain_if:
        - no_current_legal_attack
        - damage_modifier_stack_not_exact
        - weakness_or_resistance_not_exact
        - opponent_active_hp_not_exact
        - any_legal_option_unresolved

    - id: exact_garchomp_attack_choice
      supported_stages:
        - legal_attack_selection
      exact_inputs:
        - exact_current_legal_options
        - opponent_active_current_hp
        - exact_engine_current_damage_per_legal_attack
        - current_attached_energy_cards
        - current_prizes_remaining_counts
      preference:
        prefer_Corkscrew_Dive_if_it_takes_the_same_current_prizes_otherwise_prefer_Draconic_Buster_only_for_an_exact_additional_current_knockout
      abstain_if:
        - future_recovery_or_next_turn_required_to_rank_actions
        - damage_modifier_stack_not_exact
        - weakness_or_resistance_not_exact
        - prize_value_not_exact
        - any_legal_option_unresolved

    - id: exact_spiritomb_current_damage_attack
      supported_stages:
        - legal_attack_selection
      exact_inputs:
        - exact_current_legal_options
        - own_benched_Cynthias_Pokemon_damage_counters
        - opponent_active_current_hp
        - exact_engine_current_damage_per_legal_attack
      preference:
        prefer_Raging_Curse_only_when_exact_current_damage_takes_more_current_prizes_than_other_legal_attacks
      abstain_if:
        - any_benched_Cynthias_identity_or_damage_is_ambiguous
        - exact_attack_damage_unavailable
        - future_damage_or_future_board_required
        - any_legal_option_unresolved

categorical_abstentions:
  - Power_Weight_destination_without_an_exact_current_damage_threshold
  - manual_energy_attachment_or_special_energy_destination
  - Champion_Call_choice_requiring_hidden_hand_or_deck_contents
  - Corkscrew_Dive_hand_refill_value_requiring_private_hand_contents
  - recovery_or_discard_choice_requiring_future_draws
  - matchup_specific_tech_guidance
  - future_prize_map_or_future_knockout_prediction
  - opponent_hidden_hand_deck_or_prize_contents
  - unavailable_or_ambiguous_attack_damage
  - unknown_non_main_prompt_origin
  - unresolved_option_or_malformed_legal_combo
  - score_margin_below_0_25

target_safety:
  causal_current_and_past_state_only: true
  exact_current_legal_options_only: true
  publicly_visible_board_discard_counters_and_logs_only: true
  own_hidden_hand_or_deck_content_allowed: false
  opponent_hidden_information_allowed: false
  future_information_allowed: false
  outcome_conditioned_labels_allowed: false
  complete_legal_stage_scoring_required: true
  complete_stage_failure_behavior: mask_entire_stage
  minimum_preference_margin: 0.25
  ambiguous_or_low_margin_behavior: mask
  missing_label_behavior: mask_not_zero
  runtime_action_override_allowed: false
  runtime_authority: none
  guide_may_override_flat_or_fused_policy: false

