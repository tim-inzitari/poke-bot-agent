causal_heuristic_contract:
  schema_version: poke_bot.causal_deck_guide_heuristics/v1
  stage_completeness_rule: score_every_supplied_legal_combo_or_mask_entire_stage
  minimum_preference_margin: 0.25
  supported_predicates:
    - id: exact_initial_Festival_Lead_active
      supported_stages:
        - initial_setup_active
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - current_combo_card_ids
      preference:
        prefer_visible_Goldeen_with_Festival_Lead_over_non_Festival_Lead_core_basics
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
        - legal_combo_set_incomplete

    - id: exact_core_setup_redundancy
      supported_stages:
        - initial_setup_bench
        - exact_Buddy_Buddy_Poffin_search_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - current_combo_card_ids
      preference:
        build_two_visible_Grookey_and_two_visible_Applin_lines_then_one_Festival_Lead_basic_if_absent
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
        - legal_combo_set_incomplete

    - id: exact_visible_core_evolution
      supported_stages:
        - legal_evolution_action
      exact_inputs:
        - exact_current_legal_options
        - resolved_own_hand_card_id
        - own_active_and_bench_card_ids
      preference:
        prefer_visible_Applin_to_Dipplin_and_Grookey_to_Thwackey_evolutions
      abstain_if:
        - evolution_destination_unresolved
        - any_legal_option_unresolved

    - id: exact_Festival_Grounds_deployment
      supported_stages:
        - legal_main_action
      exact_inputs:
        - exact_current_legal_options
        - own_active_card_id
        - current_stadium_card_id
      preference:
        prefer_Festival_Grounds_when_a_Festival_Lead_Pokemon_is_active_and_Festival_Grounds_is_absent
      abstain_if:
        - active_identity_unresolved
        - stadium_identity_unresolved
        - any_legal_option_unresolved

    - id: exact_Boom_Boom_Groove_activation
      supported_stages:
        - legal_ability_selection
      exact_inputs:
        - exact_current_legal_options
        - own_active_card_id
        - exact_ability_origin_card_id
      preference:
        prefer_an_exactly_legal_Thwackey_Boom_Boom_Groove_activation_while_Festival_Lead_is_active
      abstain_if:
        - ability_origin_not_exactly_resolved
        - active_Festival_Lead_identity_unresolved
        - any_legal_option_unresolved

    - id: exact_Boom_Boom_Groove_engine_gap_search
      supported_stages:
        - exact_Boom_Boom_Groove_search_prompt
      exact_inputs:
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_bench_and_hand_card_ids
        - current_stadium_card_id
        - current_combo_card_ids
      preference:
        prefer_missing_Festival_Grounds_then_exact_visible_Dipplin_or_Thwackey_evolution_gaps
      abstain_if:
        - prompt_origin_not_exactly_Thwackey
        - hidden_information_beyond_exposed_legal_options_required
        - multiple_engine_gaps_have_no_exact_ordering
        - any_legal_option_unresolved

