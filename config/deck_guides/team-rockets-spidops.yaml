        - initial_setup_bench
        - exact_Buddy_Buddy_Poffin_search_prompt
        - exact_Team_Rockets_Proton_search_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - current_combo_card_ids
      preference:
        establish_up_to_three_visible_Tarountula_then_useful_single_prize_Team_Rocket_basics
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
        - legal_combo_set_incomplete

    - id: exact_visible_Spidops_evolution
      supported_stages:
        - legal_main_evolution_action
      exact_inputs:
        - exact_current_legal_options
        - resolved_own_hand_card_identity_from_current_legal_option
      preference:
        prefer_a_current_legal_Team_Rockets_Spidops_evolution_over_unranked_actions
      abstain_if:
        - evolution_destination_unresolved
        - any_legal_option_unresolved

    - id: exact_visible_Charging_Up_activation
      supported_stages:
        - legal_main_ability_selection
      exact_inputs:
        - exact_current_legal_options
        - exact_current_ability_origin_card_identity
        - own_public_discard_card_ids
        - exact_known_basic_Grass_or_Psychic_identity
      preference:
        prefer_an_exactly_legal_Spidops_Charging_Up_activation_when_a_known_Basic_Energy_is_publicly_available
      abstain_if:
        - ability_origin_not_exactly_resolved
        - no_known_Basic_Energy_in_public_discard
        - only_Special_Energy_is_publicly_available
        - any_legal_option_unresolved

