      abstain_if:
        - opening_active_stage
        - any_option_unresolved
        - legal_combo_set_incomplete
    - id: fill_visible_Slowpoke_or_Slowking_gap
      supported_stages:
        - poke_pad_search
        - ultra_ball_search
      exact_inputs:
        - resolved_effect_origin
        - complete_current_legal_combos
        - resolved_current_search_card_ids
        - own_current_active_and_bench_card_ids
      preference: fill_two_Slowpoke_or_open_Slowpoke_to_Slowking_gap
      abstain_if:
        - copied_attack_payload_route_is_the_only_difference
        - any_option_unresolved
    - id: telepathic_Psychic_exact_setup_gap
      supported_stages: [telepath_psychic_energy_search]
      exact_inputs:
        - resolved_effect_origin
        - exact_exposed_Basic_Psychic_options
        - own_current_active_and_bench_card_ids
      preference: fill_visible_Slowpoke_setup_gap
      abstain_if:
        - attachment_origin_or_search_options_unresolved
        - final_bench_slot_would_be_blindly_consumed
    - id: night_stretcher_visible_line_gap
      supported_stages: [night_stretcher_recovery]
      exact_inputs:
        - resolved_effect_origin
        - exact_discard_options
        - own_current_active_and_bench_card_ids
      preference: recover_the_visible_Slowpoke_or_Slowking_line_gap
      abstain_if:
        - any_Basic_Energy_option_requires_attachment_routing
        - copied_attack_payload_route_is_unresolved

