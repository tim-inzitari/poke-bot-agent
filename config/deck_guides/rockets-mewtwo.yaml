  causal_current_and_past_state_only: true
  exact_current_legal_options_only: true
  publicly_visible_board_discard_counters_and_logs_only: true
  own_hidden_hand_or_deck_content_allowed: false
  opponent_hidden_information_allowed: false
  future_information_allowed: false
  outcome_conditioned_labels_allowed: false
  complete_legal_stage_scoring_required: true
  complete_stage_failure_behavior: mask_entire_stage
  minimum_preference_margin: 0.25
