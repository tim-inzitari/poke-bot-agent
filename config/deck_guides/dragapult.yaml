high_confidence_principles:
  - establish_redundant_Dreepy_before_optional_rule_box_support
  - preserve_one_Drakloak_draw_lane_when_an_attacker_is_already_online
  - complete_one_Fire_plus_Psychic_attacker_before_splitting_typed_energy
  - use_Phantom_Dive_counters_only_from_exact_visible_thresholds
  - bench_Meowth_or_Fezandipiti_only_for_a_current_ability_window
  - keep_hidden_prize_future_draw_and_future_opponent_response_out_of_labels

causal_heuristic_contract:
  schema_version: poke_bot.causal_deck_guide_heuristics/v1
  stage_completeness_rule: score_every_supplied_legal_combo_or_mask_entire_stage
  minimum_preference_margin: 0.25
  supported_predicates:
    - id: exact_initial_plain_dragapult_active
      supported_stages: [initial_setup_active]
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - current_combo_card_ids
      preference: prefer_Dreepy_then_Budew_or_single_prize_pivot
      abstain_if:
        - any_legal_option_unresolved
        - legal_combo_set_incomplete
    - id: exact_initial_plain_dragapult_bench
      supported_stages: [initial_setup_bench]
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - own_active_and_bench_card_ids
      preference: establish_two_Dreepy_before_one_currently_useful_support
      abstain_if:
        - any_legal_option_unresolved
        - legal_combo_set_incomplete
    - id: exact_visible_plain_dragapult_search_gap
      supported_stages:
        - exact_Buddy_Buddy_Poffin_search_prompt
        - exact_Poke_Pad_search_prompt
        - exact_Ultra_Ball_search_prompt
        - exact_Night_Stretcher_recovery_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - own_public_discard_card_ids
      preference: fill_visible_Dreepy_Drakloak_or_Dragapult_evolution_gap
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
        - choice_requires_future_or_matchup_assumption
    - id: exact_safe_Flip_the_Script_yes_no
      supported_stages: [exact_Flip_the_Script_yes_no]
      exact_inputs:
        - select.effect_or_contextCard
        - complete_current_yes_no_stage
        - exact_current_deck_count
      preference: use_current_legal_draw_only_with_conservative_post_draw_reserve
      abstain_if:
        - ability_origin_unresolved
        - deck_count_unresolved
        - any_legal_option_unresolved

