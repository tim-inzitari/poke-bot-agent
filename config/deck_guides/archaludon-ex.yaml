  - preserve_a_replacement_Duraludon_when_a_knockout_is_live
  - seed_only_useful_Basic_Metal_into_discard_before_Assemble_Alloy
  - establish_the_Dunsparce_engine_without_speculative_multi_prize_benching
  - use_Raging_Hammer_only_from_exact_visible_damage_and_current_prize_math
  - keep_hidden_prize_future_draw_and_future_opponent_response_out_of_labels

causal_heuristic_contract:
  schema_version: poke_bot.causal_deck_guide_heuristics/v1
  stage_completeness_rule: score_every_supplied_legal_combo_or_mask_entire_stage
  minimum_preference_margin: 0.25
  supported_predicates:
    - id: exact_initial_Archaludon_active
      supported_stages: [initial_setup_active]
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - current_combo_card_ids
      preference: prefer_visible_Duraludon_then_single_prize_Dunsparce_or_Fan_Rotom
      abstain_if:
        - any_legal_option_unresolved
        - legal_combo_set_incomplete
    - id: exact_initial_Archaludon_bench
      supported_stages: [initial_setup_bench]
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - own_active_and_bench_card_ids
      preference: establish_two_Duraludon_then_two_Dunsparce_and_one_Fan_Rotom
      abstain_if:
        - any_legal_option_unresolved
        - legal_combo_set_incomplete
    - id: exact_visible_search_gap
      supported_stages:
        - exact_Fan_Call_search_prompt
        - exact_Buddy_Buddy_Poffin_search_prompt
        - exact_Poke_Pad_search_prompt
        - exact_Ultra_Ball_search_prompt
        - exact_Hilda_search_prompt
        - exact_Night_Stretcher_recovery_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
        - own_public_discard_card_ids
      preference: fill_visible_attacker_draw_engine_or_Basic_Metal_gap
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
    - id: exact_safe_draw_ability_yes_no
      supported_stages:
        - exact_Run_Away_Draw_yes_no
        - exact_Flip_the_Script_yes_no
      exact_inputs:
        - select.effect_or_contextCard
        - complete_current_yes_no_stage
        - exact_current_deck_count
        - exact_current_own_board_Pokemon_count
      preference: use_current_legal_draw_only_with_conservative_post_draw_reserve
      abstain_if:
        - ability_origin_unresolved
        - deck_count_unresolved
        - any_legal_option_unresolved

