what_the_deck_is_trying_to_do: >-
  Convert a wide Basic-Pokemon bench and typed Basic Energy into the attacker,
  pivot, or prize route that is best on the public board now. Teal Mask supplies
  Grass acceleration and cards; Energy Switch consolidates distributed Energy;
  Crispin / Glass Trumpet / Night Stretcher keep non-Grass types and discard
  resources alive; Area Zero creates bench space without forcing a turn-one
  whole-game commitment. Raging Bolt is the scalable damage branch; Mega
  Kangaskhan is the durable setup/attack branch; support pieces earn bench
  slots only through a current or mapped job.

high_confidence_principles:
  - treat_Cox_Chao_setup_preferences_as_matchup_conditional_defaults_not_a_rigid_script
  - establish_multiple_Teal_Mask_engines_only_when_Grass_and_public_board_support_them
  - prefer_Mega_Kangaskhan_blind_opener_but_Teal_when_public_board_demands_acceleration
  - skip_second_Teal_when_opponent_public_board_is_sparse_or_prize_race_is_ahead
  - bench_matchup_tools_only_for_observed_public_jobs_Clefairy_Wellspring_Bolt_ready
  - decline_further_setup_benching_once_current_public_jobs_are_covered
  - never_bench_Latias_or_Meowth_before_a_Teal_Mask_engine_exists
  - prefer_legal_Teal_Dance_Run_Errand_or_Flip_the_Script_when_ability_origin_is_exact
  - route_only_Basic_Energy_with_Energy_Switch
  - preserve_distinct_Basic_Energy_types_for_Crispin_and_attack_requirements
  - use_Raging_Bolt_discard_math_only_from_current_attached_Energy
  - use_deterministic_Kangaskhan_200_damage_floor_not_future_coin_heads
  - preserve_Latias_mobility_when_it_enables_the_current_pivot
  - name_Area_Zero_bench_collapse_before_removing_the_Stadium
  - use_only_public_prize_counts_and_current_prize_values
  - keep_attack_target_recovery_Bolt_KO_timing_and_Wellspring_pump_under_the_fused_policy

cox_chao_distillation_focus:
  schema: poke_bot.cox_chao_matchup_conditional_focus/v1
  linearity: less_linear_matchup_conditional
  gate_note: >-
    The ≥90% Cox/Chao held policy_acc gate still uses acting-seat accuracy
    (MissingNo. excluded from the denominator). Gate labels must not force one
    setup path in every matchup; sparse teacher preferences branch on public
    state and mask when the matchup is unknown or the margin is below 0.25.
  defaults_when_matchup_unknown_or_opponent_public_sparse:
    setup_active: prefer_Mega_Kangaskhan_ex_then_Teal_Mask_over_support_basics
    setup_bench: establish_one_Teal_engine_then_stop_do_not_force_second_Teal_or_Latias_Meowth
    main_abilities: prefer_legal_Teal_Dance_Run_Errand_Flip_the_Script
    energy_engine: five_type_Basic_Energy_with_Crispin_Energy_Switch_Glass_Trumpet_discipline
    attackers_fused_policy_only: Raging_Bolt_scalable_KO_vs_Kangaskhan_stable_floor_vs_Wellspring_spread
  branches_on_public_state:
    - when: opponent_public_spread_or_dragapult_pressure
      setup_active: prefer_Teal_Mask_opener_for_acceleration_over_Kangaskhan
      setup_bench: keep_up_to_two_Teal_then_job_tools_Latias_Meowth_Wellspring
    - when: opponent_public_clef_job_Darkness_Psychic_visible
      setup_bench: prefer_unique_Lillies_Clefairy_ex_over_generic_Latias_Meowth
    - when: opponent_public_spread_job_wide_bench
      setup_bench: prefer_Wellspring_ready_slot_when_legal
      attackers_fused_policy_only: Wellspring_spread_vs_single_target_compare_on_public_board
    - when: public_prize_behind
      setup_bench: keep_second_Teal_and_Bolt_ready_slot_when_legal
      attackers_fused_policy_only: favor_Bolt_KO_timing_when_attached_Energy_math_is_exact
    - when: public_prize_ahead_or_opponent_public_sparse
      setup_bench: skip_second_Teal_and_decline_speculative_support_benching
  masked_until_exact_public_inputs:
    - Bolt_Energy_discard_source_and_KO_timing
    - Wellspring_Torrential_Pump_bench_target
    - Kangaskhan_coin_bonus_damage
    - attack_selection_or_damage_target
    - hidden_opponent_archetype_label_when_board_exposes_no_signature
  note: >-
    Sparse teacher labels only complete legal stages with exact public inputs.
    Cox/Chao acting-seat play remains the ≥90% gate focus; MissingNo. is
    supplementary evidence and is excluded from the held policy_acc denominator.
    Defaults above are blind-safe scaffolding, not a universal Cox/Chao script.

