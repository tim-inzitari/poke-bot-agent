high_confidence_principles:
  - establish_redundant_visible_Dreepy_before_optional_two_prize_support
  - use_Budew_for_exact_current_item_lock_pressure
  - preserve_a_Drakloak_Recon_Directive_engine_while_evolving_an_attacker
  - attach_toward_exact_Fire_Psychic_Phantom_Dive_requirements
  - play_Crushing_Hammer_only_against_visible_attached_energy
  - never_label_or_plan_as_if_a_future_Hammer_coin_will_be_heads
  - map_all_six_Phantom_Dive_counters_to_named_future_prize_routes
  - expose_Fezandipiti_ex_only_for_material_current_draw_value

causal_heuristic_contract:
  schema_version: poke_bot.causal_deck_guide_heuristics/v1
  stage_completeness_rule: score_every_supplied_legal_combo_or_mask_entire_stage
  minimum_preference_margin: 0.25
  supported_predicates:
    - id: exact_initial_Budew_or_Dreepy_active
      supported_stages: [initial_setup_active]
      exact_inputs:
        - select.context
        - exact_current_legal_options
        - current_combo_card_ids
      preference: prefer_visible_Budew_then_Dreepy_over_support_basics
      abstain_if:
        - any_legal_option_unresolved
        - legal_combo_set_incomplete
    - id: exact_redundant_Dreepy_setup
      supported_stages:
        - initial_setup_bench
        - exact_Buddy_Buddy_Poffin_search_prompt
      exact_inputs:
        - select.context
        - select.effect_or_contextCard
        - exact_current_legal_options
        - own_active_and_bench_card_ids
      preference: establish_two_visible_Dreepy_then_one_Budew
      abstain_if:
        - prompt_origin_not_exactly_resolved
        - any_legal_option_unresolved
    - id: exact_visible_Dragapult_line_evolution
      supported_stages: [legal_main_evolution_action]
      exact_inputs:
        - exact_current_legal_options
        - resolved_own_hand_card_id
      preference: prefer_visible_Drakloak_or_Dragapult_ex_evolution_over_neutral_actions
      abstain_if:
        - evolution_card_unresolved
        - any_legal_option_unresolved
    - id: exact_Recon_Directive_activation
      supported_stages: [legal_main_ability_action]
      exact_inputs:
        - exact_current_legal_options
        - exact_ability_origin_card_id
      preference: prefer_legal_visible_Drakloak_ability_over_neutral_actions
      abstain_if:
        - ability_origin_unresolved
        - any_legal_option_unresolved
    - id: exact_Crushing_Hammer_with_visible_energy
      supported_stages: [legal_main_play_action]
      exact_inputs:
        - exact_current_legal_options
        - resolved_own_hand_card_id
        - opponent_public_active_and_bench_energyCards
      preference: prefer_legal_Crushing_Hammer_when_any_opposing_energy_is_visible
      abstain_if:
        - any_opponent_board_energy_zone_unresolved
        - no_visible_opposing_attached_energy
        - any_legal_option_unresolved
      prohibited_label_inputs:
        - future_coin_flip_result
        - future_discard_target
        - eventual_attack_or_game_outcome

masked_targets:
  - Crushing_Hammer_coin_result_or_post_heads_target
  - Phantom_Dive_attack_or_damage_counter_distribution
  - Munkidori_Adrena_Brain_source_or_target
