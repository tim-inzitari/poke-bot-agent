# Authoritative machine-readable numerical RL protocol.
schema_version: poke_bot.rl_protocol/v2
human_protocol: docs/RL_TRAINING_PROTOCOL.md
mutable_state: state/specialists.yaml

allowed_phases:
  - core_derivation
  - specialist_bootstrap
  - specialist_baseline_rl
  - specialist_gate_evaluation
  - post_fleet_specialist_refresh
  - population_round_robin
  - complete

training_hardware_throughput:
  objective: owner_pinned_blackwell_128_local_workers
  raw_simulator_slot_count_is_not_the_objective: false
  active_teal_local_profile:
    simulator_workers: 48
    environments_per_worker: 4
    effective_environment_slots: 192
    status: active_only_until_next_immutable_iteration_boundary
  historical_failed_local_profiles:
    - simulator_workers: 128
      reason: exceeded_116_gib_cgroup_and_lost_uncommitted_collection
      retained_as_historical_evidence: true
      rejection_superseded_by_owner_revision: 65
  next_boundary_blackwell_profile:
    goal_revision: 66
    boundary: committed_iteration_only
    simulator_workers: 128
    games_in_flight: 128
    environments_per_worker: 4
    effective_environment_slots: 512
    worker_floor: 128
    worker_target: 128
    worker_ceiling: 128
    live_pool_max_workers: 128
    adaptive_worker_rebalance_allowed: false
    automatic_worker_fallback_allowed: false
    throughput_comparison_required: false
    lower_profile_substitution_allowed: false
    minimum_lifetime:
      includes_remaining_specialists: true
      includes_slowking_completion: true
      includes_entry_into_first_final_submission_format_alakazam: true
      automatic_expiry_at_final_format_entry: false
      reconsideration_requires_later_explicit_owner_decision: true
    checksum_bound_activation_receipt_required: true
    memory_high_gib: 100
    memory_max_gib: 116
    memory_swap_max_gib: 0
    minimum_host_available_ram_gib: 12
    memory_guards_may_lower_worker_count: false
    memory_guard_behavior: fail_closed_without_profile_substitution
  remote_fleet:
    repair_endpoint_stalls_before_adding_local_workers: true
    elmo:
      endpoint: 192.168.1.143:8765
      simulator_workers: 36
      process_tree_rss_limit_gib: 30
      container_memory_limit_gib: 64
      host_available_ram_floor_gib: 24
      planned_service_rotation_completed_jobs: 768
      drain_active_jobs_before_exit: true
      preserve_active_checkpoint_digest: true
      activation_boundary: next_committed_boundary_with_no_active_remote_jobs
    bert:
      endpoint: 192.168.1.158:8766
      preserve_current_managed_profile: true

active_specialist_owner_transition_override:
  goal_revision: 67
  specialist_id: teal-mask-ogerpon-ex
  activation: immediate_managed_boundary
  stop_uncommitted_iteration: 15
  accepted_completed_iteration: 14
  completion_authority: explicit_owner_ceiling_acceptance
  measured_gate_result_preserved: true
  measured_gate_pass_rewrite_allowed: false
  accepted_checkpoint_sha256: sha256:5c74cfb63626337c0146e740e4c8e4f90fa8a4a1c8dc0b422f0904f3e911b821
  submission:
    mode: queue_and_continue
    count: 2
    same_frozen_checkpoint_required: true
    same_exact_deck_required: true
    turn_order_preferences: [first_if_allowed, second_if_allowed]
  next_specialist: archaludon-ex
  next_specialist_must_pass_existing_fail_closed_readiness: true
  direct_process_signal_allowed: false
  managed_service_stop_required: true
  uncommitted_iteration_15_training_or_gate_evidence_allowed: false

shared_core_derivation:
  source_specialist: alakazam
  keep_source_specialist_active_through_completed_iteration: 30
  allow_transition_before_completed_iteration: false
  source_requires_both_established_gates: true
  source_selection: strongest_validated_checkpoint_at_or_before_iteration_30
  lc55_preferred: true
  lc50_fallback_allowed_only_after_completed_iteration: 30
  transfer_initialization:
    preserve_exact:
      - card_and_state_embeddings
      - spatial_encoder
      - temporal_encoder
      - option_decoder
      - shared_policy_head
      - shared_value_head
      - deck_agnostic_auxiliary_heads
    reset_exact:
      - matchup_adapter_tensors
      - specialist_optimizer_state
      - specialist_scaler_state
      - specialist_scheduler_state
      - specialist_rng_state
      - specialist_training_counters
      - specialist_only_metadata
    matchup_adapters_zero_output: true
    matchup_runtime_enabled: false
    matchup_training_enabled: false
    tensor_preservation_audit_required: true
  supervised_distillation:
    source: protected_balanced_multi_archetype_top_ladder_replays
    max_epochs: 25
    early_stop_patience: 5
    early_stop_min_delta: 0.0001
    minimum_decisions: 500000
    requested_decisions_per_batch: 12288
    episode_disjoint_validation: true
    alakazam_guide_loss_weight: 0.0
    train_policy: true
    train_value: true
    train_archetype_auxiliary: true
    train_opponent_belief: true
    train_lethal_threat: true
    train_prize_race: true
    matchup_adapter_state_must_remain_bit_identical: true
  freeze_best_validation_checkpoint: true
  specialist_hot_start_uses_frozen_core: true

shared_core_refresh:
  enabled: true
  first_refresh_boundary: after_starmie_training_complete
  refresh_before_every_later_specialist: true
  output_version_increments_at_each_specialist_boundary: true
  teacher_population: all_checksum_verified_frozen_specialists
  newly_passing_specialist_must_be_in_next_core: true
  next_specialist_hot_start_requires_latest_accepted_core: true
  applies_to_starmie: false
  first_refreshed_core_version: 2
  immutable_teacher_specialists:
    - hops-trevenant
    - starmie
  direct_checkpoint_tensor_sources_exclude: []
  alakazam_role_after_starmie: frozen_teacher_and_evaluation_opponent
  teacher_use: inference_only
  teacher_gradients_allowed: false
  teacher_optimizer_steps_allowed: false
  teacher_checkpoint_replacement_allowed: false
  initialization_core_version: 1
  distillation:
    source: protected_balanced_multi_archetype_top_ladder_replays
    max_epochs: 25
    early_stop_patience: 5
    early_stop_min_delta: 0.0001
    minimum_decisions: 500000
    requested_decisions_per_batch: 12288
    episode_disjoint_validation: true
    balance_teacher_contributions_as_evenly_as_integer_counts_permit: true
    teacher_behavior_repair:
      allowed_only_after_bounded_parameter_space_failures: true
      maximum_parameter_space_attempts: 4
      maximum_behavior_repair_attempts: 1
      target: matching_archetype_frozen_teacher_greedy_action
      causal_inputs_only: true
      teacher_checkpoint_immutable: true
      teacher_gradients_allowed: false
      nonmatching_archetype_rows_masked: true
      loss_weight: 0.5
      exact_25_epoch_schedule_unchanged: true
      gameplay_gate_thresholds_unchanged: true
    train_policy: true
    train_value: true
    train_archetype_auxiliary: true
    train_opponent_belief: true
    train_lethal_threat: true
    train_prize_race: true
    matchup_adapter_state_must_remain_bit_identical: true
  acceptance:
    protected_checkpoint_required: true
    checksum_required: true
    reproducibility_receipt_required: true
    balanced_corpus_identity_required: true
    all_teacher_identities_required: true
    neutral_zero_output_matchup_adapters_required: true
    regression_evaluation_against_each_teacher_required: true
    established_gate_thresholds_only: true
    gameplay_regression:
      games_per_teacher: 80
      per_teacher_minimum_raw_win_rate: 0.35
      aggregate_minimum_raw_win_rate: 0.40
      confidence_level: 0.90
      confidence_intervals_diagnostic_only: true
      training_eligible: false
      replay_eligible: false
      authoritative_source: >-
        owner directive 2026-07-24; canonicalized at
        config/rl_protocol.yaml#/shared_core_refresh/acceptance/gameplay_regression
    specialist_gate_thresholds_unchanged: true
  next_specialist_handoff:
    refresh_core_before_bootstrap: true
    fixed_historical_core_reuse_for_later_specialists: false
    refreshed_core_required_before_bootstrap: false
    fail_closed_if_refresh_not_validated: false
    rejected_refresh_candidate_behavior: preserve_rejected_and_continue
    fallback_core_selection: latest_checksum_accepted_core
    fallback_current_version: 9
    fallback_current_checkpoint: /home/inzi/poke-bot-agent/outputs/pure_rl/_protected/models/deck_agnostic_core_cumulative_v9_fused_v1/model.pt
    fallback_current_checkpoint_checksum: sha256:7d9b60e68f4c51bb931298ae3941e5b7bddf1370566b23d18acadd33e8357056
    fallback_current_ready_receipt: /home/inzi/poke-bot-agent/outputs/state/deck-agnostic-core-cumulative-v9-fused-v1-ready.json
    continue_refresh_after_every_completed_specialist: true
    fallback_does_not_weaken_refresh_acceptance_gate: true
    select_next_unfinished_specialist_after_meta_refresh: true
    hot_start_from_refreshed_core_or_latest_accepted_fallback: true
    pre_stage_while_active_specialist_trains: true
    pre_stage_is_read_only_to_live_training: true
    pre_stage_may_build_derived_cpu_tensor_pack: true
    pre_stage_may_not_update_selector_or_runtime_registry: true
    pre_stage_may_not_control_training_services: true
    pre_stage_receipt_schema: poke_bot.next_specialist_prestage/v1
    clean_transition:
      required: true
      preflight_before_specialist_start: true
      preflight_training_launch_path: true
      preflight_terminal_freeze_package_submission_handoff_path: true
      exact_logical_specialist_representative_required: true
      representative_card_count: 60
      deterministic_transition_input_error_timing: before_rl_training
      successful_trainer_exit_action: start_idempotent_gate_handler
      periodic_gate_supervisor_role: recovery_only
      periodic_gate_supervisor_is_normal_transition_path: false
      submission_completion_blocks_handoff: false
    boundary_only_steps:
      - freeze_and_register_passing_specialist
      - distill_and_validate_cumulative_core
      - run_exact_25_epoch_specialist_bootstrap
      - materialize_checksum_bound_s_plus_gate
      - atomically_update_selector_and_start_managed_service

specialist_training:
  concurrency: 1
  orchestration:
    objective: maximize_completed_iterations_per_wall_clock_hour
    independent_tasks_parallel_by_default: true
    serialize_only_on_explicit_dependency: true
    allowed_sequential_dependencies:
      - artifact_input_not_ready
      - checksum_or_immutable_receipt_not_committed
      - safe_selector_transition_boundary
      - single_active_specialist_model_update
    overlap_with_healthy_active_training:
      - source_download_and_validation
      - per_day_featurization
      - corpus_assembly
      - current_deck_guide_preparation
      - derived_cpu_pack_construction
      - dashboard_validation
      - next_specialist_readiness_validation
    healthy_training_may_be_preempted_for_preparation: false
    obey_memory_guards: true
    active_training_starvation_allowed: false
  expert_corpus:
    source_window_unit: calendar_day
    source_window_days: 20
    window_selection: latest_available_fully_validated_daily_sources
    filter_after_source_window_selection: true
    filter_to_active_specialist_archetype: true
    expand_window_to_reach_sample_target: false
    reuse_filtered_corpus_for_different_specialist: false
    require_checksum_validated_archive_per_day: true
    require_checksum_validated_feature_shard_per_day: true
    require_all_source_days_in_protected_receipt: true
    retain_zero_match_days_in_provenance: true
    record_matching_games_and_decisions_per_day: true
    dashboard_source_day_slots: 20
    dashboard_show_all_source_days: true
    dashboard_present_requires_validated_archive_and_feature: true
    zero_matching_games_counts_as_present: true
    missing_source_day_counts_as_present: false
    historical_zero_match_fallback:
      allowed: true
      prerequisite_latest20_receipt_complete: true
      trigger_metric: aggregate_matching_games_across_latest20
      trigger_exact_value: 0
      prohibited_when_latest20_matching_games_greater_than: 0
      low_decision_count_does_not_authorize_fallback: true
      sources: older_checksum_validated_archive_and_feature_shards
      expands_or_replaces_latest20_window: false
      separate_immutable_receipt_required: true
      required_label: historical_zero_match_fallback
      may_be_described_as_latest20: false
      receipt_requires_latest20_zero_match_proof: true
      receipt_requires_active_archetype: true
      receipt_requires_every_fallback_date_and_checksum: true
      receipt_requires_per_day_matching_games_and_decisions: true
      receipt_requires_aggregate_matching_games_and_decisions: true
      dashboard_show_separately_from_latest20_dates: true
      search_order: null
      shard_limit: null
      stopping_rule: null
    refresh_before_bootstrap: true
    refresh_before_rehearsal_when_new_validated_day_available: true
    running_update_remains_bound_to_pinned_corpus: true
    refresh_activation_boundary: next_safe_bootstrap_or_rehearsal
    archive_refresh:
      index_poll_interval_seconds: 3600
      rolling_window_days: 20
      kaggle_ingress_host: bert
      kaggle_ingress_interface: wifi
      kaggle_ingress_device: en1
      elmo_transfer_interface: bert_ethernet
      elmo_transfer_source_address: 192.168.1.158
      archive_host: elmo
      reuse_checksum_valid_elmo_archives: true
      atomic_receipt_required: true
      delete_bert_archive_after_elmo_checksum_commit: true
      persistent_replay_archives_on_bert: 0
      replay_archives_may_traverse_inzi: false
      running_training_may_be_modified: false
    authoritative_source: >-
      owner design decision 2026-07-24; canonicalized at
      config/rl_protocol.yaml#/specialist_training/expert_corpus
  selection_order:
    active_specialist_is_non_preemptible: true
    candidates: unfinished_without_passing_frozen_checkpoint
    primary_sort: existing_specialist_model_artifact_absent_first
    secondary_sort: public_ladder_meta_inclusion_share_descending
    tie_break: stable_target_registry_order
    null_share_sort: last_within_model_availability_group
    artifact_availability_does_not_imply_protocol_validity: true
    recorded_overlap_deferral_allowed: true
    recorded_operator_priority_prefix_allowed: true
    overlap_deferral_removes_target: false
    owner_removed_specialist_ids:
      - dragapult
      - dragapult-blaziken
      - dragapult-dudunsparce
      - crustle
      - walrein
    owner_removed_specialists_are_selection_eligible: false
    owner_removed_specialists_count_toward_completion: false
    owner_removed_historical_artifacts_are_preserved: true
    owner_removed_stable_matchup_slots_are_deleted_or_reused: false
    owner_removal_activation: next_receipt_backed_successor_selection
    refresh_before_specialist_handoff: true
    reorder_started_specialist: false
    meta_share_changes_gate_thresholds: false
    meta_share_training_eligible: false
    authoritative_runtime_values: state/specialists.yaml#/training_priority
  post_fleet_refresh:
    owner_decision_revision: 64
    owner_decision_revisions: [36, 64]
    phase_id: post-fleet-alakazam-grimms-refresh-v1
    enabled: true
    status: staged_waiting_for_required_fleet
    trigger:
      required_specialists_total: 15
      all_required_specialists_training_complete: true
      all_required_specialists_frozen_and_registered: true
      terminal_required_specialist_id: slowking
      slowking_freeze_and_registration_immediately_triggers_first_refresh: true
      pending_kaggle_submissions_block_trigger: false
    ordered_specialist_ids:
      - alakazam
      - marnie-s-grimmsnarl-ex
    order_is_strict: true
    release_gates:
      final_alakazam_model_computation:
        required_receipts:
          - required_specialist_fleet_complete_for_final_alakazam_v1
          - capacity_research_resource_lease_v1
        all_required_before_model_computation: true
        authorization_scope: final_format_alakazam_refresh_only
        no_receipt_no_model_work: true
      broader_multi_archetype_capacity_program:
        required_receipt: post_refresh_sequence_complete_for_capacity_v2
        requires_final_format_alakazam_and_marnie_refresh_complete: true
        no_receipt_no_model_work: true
    first_refresh:
      specialist_id: alakazam
      start_timing: immediately_after_slowking_frozen_and_registered
      model_format: final_submission_format
      format_contract: docs/FINAL_MODEL_CAPACITY_AND_DECISION_REPLAY_PLAN.md
      first_final_format_model: true
      final_format_computation_before_slowking_completion_allowed: false
      validation_and_compatibility_receipts_required: true
      silent_legacy_format_fallback_allowed: false
      turn_order:
        training_seat_split: {first: 0.5, second: 0.5}
        exact_even_split_required: true
        deterministic_assignment_required: true
        seat_count_parity_receipt_required: true
        seat_count_parity_receipt_schema: poke_bot.alakazam_refresh_seat_split/v1
        seat_count_receipt_required_stages: [assigned, actual, consumed]
        equal_first_second_counts_required_at_each_stage: true
        package_preference: first_if_allowed
        second_focus_1_to_7_allowed: false
        always_second_arm_allowed: false
        second_preferring_refresh_copy_allowed: false
      preferred_parent_migration:
        parent_specialist_id: alakazam
        parent_checkpoint: immutable_existing_alakazam
        parent_checkpoint_sha256: sha256:270b5156781b0a95f703abe3e8fe13866d2fbb4c85a8f32534f99af74aece2ea
        require_checksum_bound_shape_and_key_coverage: true
        genuinely_new_structures_initialization: zero_safe
        step_zero_parity_receipt_required: true
        causal_validation_receipt_required: true
        original_checkpoint_may_be_rewritten: false
        failed_or_partial_migration_promotable: false
        failure_fallback:
          migration_failure_receipt_preserved: true
          ordinary_same_archetype_alakazam_refresh_initialized_from: then_latest_checksum_accepted_core
          expand_only_that_completed_alakazam_derivative_to_final_format: true
          latest_core_direct_final_format_tensor_parent_allowed: false
          partial_old_alakazam_core_overlay_allowed: false
    identity:
      new_separately_versioned_derivative_required: true
      logical_specialist_id_is_preserved: true
      refresh_model_version_assigned_by_activation_receipt: true
      original_passing_checkpoint_immutable: true
      original_checkpoint_replacement_allowed: false
      original_checkpoint_refreeze_allowed: false
      original_gate_and_submission_evidence_preserved: true
    core_hot_start:
      resolve_at_each_refresh_start: latest_checksum_accepted_cumulative_core
      first_alakazam_prefer_compatible_immutable_alakazam_migration: true
      first_alakazam_migration_failure_fallback:
        migration_failure_receipt_preserved: true
        ordinary_same_archetype_alakazam_refresh_initialized_from: latest_checksum_accepted_cumulative_core
        expand_only_that_completed_alakazam_derivative_to_final_format: true
        latest_core_direct_final_format_tensor_parent_allowed: false
        partial_old_alakazam_core_overlay_allowed: false
      pinned_core_generation_allowed: false
      normal_cumulative_core_refresh_attempt_required_at_each_predecessor_boundary: true
      rejected_candidate_behavior: preserve_immutable_and_use_latest_accepted_fallback
      grimms_refresh_must_resolve_after_alakazam_boundary: true
    training_structure_resolution:
      resolve_at_each_refresh_start: current_canonical_training_contracts
      pinned_current_schema_digests_allowed: false
      canonical_sources:
        - config/rl_protocol.yaml#/specialist_training
        - config/rl_protocol.yaml#/baseline_phase_iteration
        - config/rl_protocol.yaml#/research_evaluations
        - config/rl_protocol.yaml#/specialist_pass_transition
        - state/specialists.yaml#/post_fleet_refresh
      exact_bootstrap_epochs: 25
      latest20_specialist_corpus_required: true
      current_deck_guide_contract_required: true
      causal_learned_decision_fusion_required: true
      all_then_canonical_causally_available_heads_required: true
      current_matchup_architecture_required: true
      baseline_games_per_iteration: 8192
      rl_epochs_per_iteration: 5
      expert_rehearsal_epochs_per_iteration: 5
      established_gate_thresholds_unchanged: true
    legacy_compatibility_derivatives:
      old_v5_bound_alakazam_derivative_counts_as_refresh_output: false
      old_materialization_receipt_is_compatibility_evidence_only: true
      refresh_must_be_rebuilt_or_rebound_to_resolved_core_and_structures: true
    isolation:
      sole_active_refresh_learner: true
      modifies_current_required_roster: false
      counts_toward_required_specialist_total: false
      current_selector_eligible: false
      current_prestage_eligible: false
      current_runtime_registry_eligible: false
      current_training_service_eligible: false
      current_active_training_may_be_modified: false
    completion:
      each_refresh_requires_independent_gate_freeze_and_registration: true
      receipt_schema: poke_bot.post_fleet_specialist_refresh_completion/v1
      ordered_receipt_fields:
        - specialist_id
        - refresh_model_version
        - original_checkpoint_checksum
        - refresh_checkpoint_checksum
        - resolved_core
        - training_contract
        - current_gate_pass
        - gate_receipt_sha256
        - frozen
        - freeze_receipt_sha256
        - registered
        - registration_receipt_sha256
      resolved_core_status_required: checksum_accepted
      training_contract_source_required: config/rl_protocol.yaml#/specialist_training
      population_transition_blocked_until_all_refreshes_complete: true
    authoritative_runtime_values: state/specialists.yaml#/post_fleet_refresh
  meta_analysis:
    authoritative_source: https://ptcgreplay.netlify.app/
    retired_source: https://ptcg-ladder-meta.vercel.app/strategies
    retired_source_must_not_be_used: true
    access:
      authentication: site_published_config_with_supabase_rls
      credentials_may_be_committed: false
      rendered_chart_scraping_allowed: false
    data_contract:
      completed_ingest_table: ingest_runs
      archetype_table: archetypes
      deck_table: decks
      per_match_rpc: match_facts
      aggregation_semantics: ptcgreplay_side_aware_browser_aggregation
      play_order_unknown_rows: exclude_when_filtering_by_play_order
      mirror_matchup_rate: even_by_definition
    governs:
      - archetype_prevalence
      - matchup_analysis
      - play_order_analysis
      - deck_list_analysis
      - unfinished_specialist_priority
    must_not_govern:
      - training_examples
      - expert_replay_labels
      - official_or_premium_holdouts
      - gate_thresholds
      - checkpoint_acceptance
    refresh_before_specialist_handoff: true
    immutable_snapshot_receipt_required: true
    authoritative_runtime_snapshot: state/specialists.yaml#/training_priority/source
  hot_start_from_shared_core: true
  generate_archetype_head: true
  generate_game_plan_heads: true
  generate_matchup_heads: true
  current_deck_guide:
    required_for_every_new_specialist: true
    design_reference: validated_alakazam_masked_policy_guide
    implementation: scoped_training_only_sparse_teacher
    separate_parameterized_action_head: false
    training_target_modes:
      legacy_started_runs:
        mode: confidence_weighted_policy_cross_entropy
        immutable_scope: completed_frozen_and_already_started_specialists
        active_teal_remains_legacy: true
      future_specialists:
        owner_decision_revision: 51
        effective_from_specialist: archaludon-ex
        mode: bounded_strategic_head_curriculum
        direct_policy_cross_entropy_allowed: false
        guide_runtime_input_allowed: false
        guide_action_selection_allowed: false
        replace_observed_outcome_targets_allowed: false
        curriculum_focus: relevant_causal_heads_on_high_confidence_guide_rows
        fused_policy_learning_authority: realized_outcomes_and_win_objectives
