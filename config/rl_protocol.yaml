      copies: 1
      turn_order_preference: first_if_allowed
      only_archive_member_allowed_to_change: deck.csv
      canonical_specialist_representative_changed: false
      training_freeze_registration_or_selector_authority: none
      normal_specialist_submission_obligation_changed: false
      submit_via_digest_bound_one_shot_guard_only: true
      receipt: state/alakazam_h10_no_train_list_experiment_r115.json
