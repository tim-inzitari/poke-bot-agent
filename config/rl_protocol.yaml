# Authoritative machine-readable numerical RL protocol.
schema_version: poke_bot.rl_protocol/v2
human_protocol: docs/RL_TRAINING_PROTOCOL.md
mutable_state: state/specialists.yaml

allowed_phases:
  - core_derivation
  - specialist_bootstrap
  - specialist_baseline_rl
  - specialist_gate_evaluation
  - population_round_robin
  - complete

shared_core_derivation:
  source_specialist: alakazam
  keep_source_specialist_active_through_completed_iteration: 30
  allow_transition_before_completed_iteration: false
  source_requires_both_established_gates: true
  source_selection: strongest_validated_checkpoint_at_or_before_iteration_30
  lc55_preferred: true
  lc50_fallback_allowed_only_after_completed_iteration: 30
  transfer_initialization:
    preserve_exact:
      - card_and_state_embeddings
      - spatial_encoder
      - temporal_encoder
      - option_decoder
      - shared_policy_head
      - shared_value_head
      - deck_agnostic_auxiliary_heads
    reset_exact:
      - matchup_adapter_tensors
      - specialist_optimizer_state
      - specialist_scaler_state
      - specialist_scheduler_state
      - specialist_rng_state
      - specialist_training_counters
      - specialist_only_metadata
    matchup_adapters_zero_output: true
    matchup_runtime_enabled: false
    matchup_training_enabled: false
    tensor_preservation_audit_required: true
  supervised_distillation:
    source: protected_balanced_multi_archetype_top_ladder_replays
    max_epochs: 25
    early_stop_patience: 5
    early_stop_min_delta: 0.0001
    minimum_decisions: 500000
    requested_decisions_per_batch: 12288
    episode_disjoint_validation: true
    alakazam_guide_loss_weight: 0.0
    train_policy: true
    train_value: true
    train_archetype_auxiliary: true
    train_opponent_belief: true
    train_lethal_threat: true
    train_prize_race: true
    matchup_adapter_state_must_remain_bit_identical: true
  freeze_best_validation_checkpoint: true
  specialist_hot_start_uses_frozen_core: true

shared_core_refresh:
  enabled: true
  first_refresh_boundary: after_starmie_training_complete
  refresh_before_every_later_specialist: true
  output_version_increments_at_each_specialist_boundary: true
  teacher_population: all_checksum_verified_frozen_specialists
  newly_passing_specialist_must_be_in_next_core: true
  next_specialist_hot_start_requires_latest_accepted_core: true
  applies_to_starmie: false
  first_refreshed_core_version: 2
  immutable_teacher_specialists:
    - hops-trevenant
    - starmie
  direct_checkpoint_tensor_sources_exclude: []
  alakazam_role_after_starmie: frozen_teacher_and_evaluation_opponent
  teacher_use: inference_only
  teacher_gradients_allowed: false
  teacher_optimizer_steps_allowed: false
  teacher_checkpoint_replacement_allowed: false
  initialization_core_version: 1
  distillation:
    source: protected_balanced_multi_archetype_top_ladder_replays
    max_epochs: 25
    early_stop_patience: 5
    early_stop_min_delta: 0.0001
    minimum_decisions: 500000
    requested_decisions_per_batch: 12288
    episode_disjoint_validation: true
    balance_teacher_contributions_as_evenly_as_integer_counts_permit: true
    teacher_behavior_repair:
      allowed_only_after_bounded_parameter_space_failures: true
      maximum_parameter_space_attempts: 4
      maximum_behavior_repair_attempts: 1
      target: matching_archetype_frozen_teacher_greedy_action
      causal_inputs_only: true
      teacher_checkpoint_immutable: true
      teacher_gradients_allowed: false
      nonmatching_archetype_rows_masked: true
      loss_weight: 0.5
      exact_25_epoch_schedule_unchanged: true
      gameplay_gate_thresholds_unchanged: true
    train_policy: true
    train_value: true
    train_archetype_auxiliary: true
    train_opponent_belief: true
    train_lethal_threat: true
    train_prize_race: true
    matchup_adapter_state_must_remain_bit_identical: true
  acceptance:
    protected_checkpoint_required: true
    checksum_required: true
    reproducibility_receipt_required: true
    balanced_corpus_identity_required: true
    all_teacher_identities_required: true
    neutral_zero_output_matchup_adapters_required: true
    regression_evaluation_against_each_teacher_required: true
    established_gate_thresholds_only: true
    gameplay_regression:
      games_per_teacher: 80
      per_teacher_minimum_raw_win_rate: 0.35
      aggregate_minimum_raw_win_rate: 0.40
      confidence_level: 0.90
      confidence_intervals_diagnostic_only: true
      training_eligible: false
      replay_eligible: false
      authoritative_source: >-
        owner directive 2026-07-24; canonicalized at
        config/rl_protocol.yaml#/shared_core_refresh/acceptance/gameplay_regression
    specialist_gate_thresholds_unchanged: true
  next_specialist_handoff:
    refresh_core_before_bootstrap: true
    fixed_historical_core_reuse_for_later_specialists: false
    refreshed_core_required_before_bootstrap: false
    fail_closed_if_refresh_not_validated: false
    rejected_refresh_candidate_behavior: preserve_rejected_and_continue
    fallback_core_selection: latest_checksum_accepted_core
    fallback_current_version: 6
    fallback_current_checkpoint: /home/inzi/poke-bot-agent/outputs/pure_rl/_protected/models/deck_agnostic_core_cumulative_v6/model.pt
    fallback_current_checkpoint_checksum: sha256:e1966ea311657c9a68f918da0f9276df6d74258216f38837a294d1f9c1cb2490
    fallback_current_ready_receipt: /home/inzi/poke-bot-agent/outputs/state/deck-agnostic-core-cumulative-v6-ready.json
    continue_refresh_after_every_completed_specialist: true
    fallback_does_not_weaken_refresh_acceptance_gate: true
    select_next_unfinished_specialist_after_meta_refresh: true
    hot_start_from_refreshed_core_or_latest_accepted_fallback: true
    pre_stage_while_active_specialist_trains: true
    pre_stage_is_read_only_to_live_training: true
    pre_stage_may_build_derived_cpu_tensor_pack: true
    pre_stage_may_not_update_selector_or_runtime_registry: true
    pre_stage_may_not_control_training_services: true
    pre_stage_receipt_schema: poke_bot.next_specialist_prestage/v1
    clean_transition:
      required: true
      preflight_before_specialist_start: true
      preflight_training_launch_path: true
      preflight_terminal_freeze_package_submission_handoff_path: true
      exact_logical_specialist_representative_required: true
      representative_card_count: 60
      deterministic_transition_input_error_timing: before_rl_training
      successful_trainer_exit_action: start_idempotent_gate_handler
      periodic_gate_supervisor_role: recovery_only
      periodic_gate_supervisor_is_normal_transition_path: false
      submission_completion_blocks_handoff: false
    boundary_only_steps:
      - freeze_and_register_passing_specialist
      - distill_and_validate_cumulative_core
      - run_exact_25_epoch_specialist_bootstrap
      - materialize_checksum_bound_s_plus_gate
      - atomically_update_selector_and_start_managed_service

specialist_training:
  concurrency: 1
  orchestration:
    objective: maximize_completed_iterations_per_wall_clock_hour
    independent_tasks_parallel_by_default: true
    serialize_only_on_explicit_dependency: true
    allowed_sequential_dependencies:
      - artifact_input_not_ready
      - checksum_or_immutable_receipt_not_committed
      - safe_selector_transition_boundary
      - single_active_specialist_model_update
    overlap_with_healthy_active_training:
      - source_download_and_validation
      - per_day_featurization
      - corpus_assembly
      - current_deck_guide_preparation
      - derived_cpu_pack_construction
      - dashboard_validation
      - next_specialist_readiness_validation
    healthy_training_may_be_preempted_for_preparation: false
    obey_memory_guards: true
    active_training_starvation_allowed: false
  expert_corpus:
    source_window_unit: calendar_day
    source_window_days: 20
    window_selection: latest_available_fully_validated_daily_sources
    filter_after_source_window_selection: true
    filter_to_active_specialist_archetype: true
    expand_window_to_reach_sample_target: false
    reuse_filtered_corpus_for_different_specialist: false
    require_checksum_validated_archive_per_day: true
    require_checksum_validated_feature_shard_per_day: true
    require_all_source_days_in_protected_receipt: true
    retain_zero_match_days_in_provenance: true
    record_matching_games_and_decisions_per_day: true
    dashboard_source_day_slots: 20
    dashboard_show_all_source_days: true
    dashboard_present_requires_validated_archive_and_feature: true
    zero_matching_games_counts_as_present: true
    missing_source_day_counts_as_present: false
    historical_zero_match_fallback:
      allowed: true
      prerequisite_latest20_receipt_complete: true
      trigger_metric: aggregate_matching_games_across_latest20
      trigger_exact_value: 0
      prohibited_when_latest20_matching_games_greater_than: 0
      low_decision_count_does_not_authorize_fallback: true
      sources: older_checksum_validated_archive_and_feature_shards
      expands_or_replaces_latest20_window: false
      separate_immutable_receipt_required: true
      required_label: historical_zero_match_fallback
      may_be_described_as_latest20: false
      receipt_requires_latest20_zero_match_proof: true
      receipt_requires_active_archetype: true
      receipt_requires_every_fallback_date_and_checksum: true
      receipt_requires_per_day_matching_games_and_decisions: true
      receipt_requires_aggregate_matching_games_and_decisions: true
      dashboard_show_separately_from_latest20_dates: true
      search_order: null
      shard_limit: null
      stopping_rule: null
    refresh_before_bootstrap: true
    refresh_before_rehearsal_when_new_validated_day_available: true
    running_update_remains_bound_to_pinned_corpus: true
    refresh_activation_boundary: next_safe_bootstrap_or_rehearsal
    archive_refresh:
      index_poll_interval_seconds: 3600
      rolling_window_days: 20
      kaggle_ingress_host: bert
      kaggle_ingress_interface: wifi
      kaggle_ingress_device: en1
      elmo_transfer_interface: bert_ethernet
      elmo_transfer_source_address: 192.168.1.158
      archive_host: elmo
      reuse_checksum_valid_elmo_archives: true
      atomic_receipt_required: true
      delete_bert_archive_after_elmo_checksum_commit: true
      persistent_replay_archives_on_bert: 0
      replay_archives_may_traverse_inzi: false
      running_training_may_be_modified: false
    authoritative_source: >-
      owner design decision 2026-07-24; canonicalized at
      config/rl_protocol.yaml#/specialist_training/expert_corpus
  selection_order:
    active_specialist_is_non_preemptible: true
    candidates: unfinished_without_passing_frozen_checkpoint
    primary_sort: existing_specialist_model_artifact_absent_first
    secondary_sort: public_ladder_meta_inclusion_share_descending
    tie_break: stable_target_registry_order
    null_share_sort: last_within_model_availability_group
    artifact_availability_does_not_imply_protocol_validity: true
    recorded_overlap_deferral_allowed: true
    recorded_operator_priority_prefix_allowed: true
    overlap_deferral_removes_target: false
    owner_removed_specialist_ids:
      - dragapult-blaziken
      - dragapult-dudunsparce
    owner_removed_specialists_are_selection_eligible: false
    owner_removed_specialists_count_toward_completion: false
    owner_removed_historical_artifacts_are_preserved: true
    owner_removed_stable_matchup_slots_are_deleted_or_reused: false
    owner_removal_activation: next_receipt_backed_successor_selection
    refresh_before_specialist_handoff: true
    reorder_started_specialist: false
    meta_share_changes_gate_thresholds: false
    meta_share_training_eligible: false
    authoritative_runtime_values: state/specialists.yaml#/training_priority
  meta_analysis:
    authoritative_source: https://ptcgreplay.netlify.app/
    retired_source: https://ptcg-ladder-meta.vercel.app/strategies
    retired_source_must_not_be_used: true
    access:
      authentication: site_published_config_with_supabase_rls
      credentials_may_be_committed: false
      rendered_chart_scraping_allowed: false
    data_contract:
      completed_ingest_table: ingest_runs
      archetype_table: archetypes
      deck_table: decks
      per_match_rpc: match_facts
      aggregation_semantics: ptcgreplay_side_aware_browser_aggregation
      play_order_unknown_rows: exclude_when_filtering_by_play_order
      mirror_matchup_rate: even_by_definition
    governs:
      - archetype_prevalence
      - matchup_analysis
      - play_order_analysis
      - deck_list_analysis
      - unfinished_specialist_priority
    must_not_govern:
      - training_examples
      - expert_replay_labels
      - official_or_premium_holdouts
      - gate_thresholds
      - checkpoint_acceptance
    refresh_before_specialist_handoff: true
    immutable_snapshot_receipt_required: true
    authoritative_runtime_snapshot: state/specialists.yaml#/training_priority/source
  hot_start_from_shared_core: true
  generate_archetype_head: true
  generate_game_plan_heads: true
  generate_matchup_heads: true
  current_deck_guide:
    required_for_every_new_specialist: true
    design_reference: validated_alakazam_masked_policy_guide
    implementation: generic_sparse_teacher_over_existing_policy_logits
    separate_parameterized_action_head: false
    goal_path_guidance:
      owner_vision_required: true
      purpose: realized_win_contribution_weighted_strategy_north_star
      bootstrap_behavior: ramp_in
      positive_contribution_behavior: hold
      internalized_or_nonpositive_behavior: anneal_toward_zero
      evidence_source: training_ineligible_guide_on_guide_off_evaluation_pairs
      training_outcomes_may_control_weight: false
      formal_gate_games_may_control_weight: false
      silent_removal_or_fixed_weight_replacement_allowed: false
    contract_schema: poke_bot.current_deck_guide/v1
    contract_root: config/deck_guides
    exactly_one_contract_per_specialist: true
    build_during_dependency_free_prestage: true
    cited_public_strategy_sources_required: true
    source_retrieval_timestamp_required: true
    source_checksum_or_canonical_url_required: true
    expert_writeup:
      required: true
      format: utf8_text_or_markdown
      root: docs/deck_guides
      maximum_words: 10000
      intended_audience: world_champion_subject_matter_experts
      primary_document_type: practical_human_deck_pilot_guide
      how_to_play_is_primary: true
      required_play_sections:
        - strategic_identity
        - deck_variants_and_card_roles
        - setup_and_opening_priorities
        - going_first_plan
        - going_second_plan
        - turn_by_turn_sequencing
        - resource_and_energy_planning
        - attack_selection
        - bench_management
        - prize_mapping
        - matchup_plans
        - recovery_lines
        - common_mistakes
        - decision_checklists
        - expert_review_questions
      evidence_limited_sections_may_state_uncertainty: true
      unsupported_exact_mechanics_may_be_invented: false
      heuristic_audit_location: short_appendix_only
      heuristic_audit_may_be_primary_content: false
      same_strategy_source_set_as_guide_contract_required: true
      guide_identity_required: true
      path_checksum_and_word_count_required_in_guide_contract: true
      checksum_validation_required_before_prestage_ready: true
    research_execution:
      executor: dedicated_subagent
      reasoning_tier: highest_available
      exact_task_scope:
        - expert_facing_guide
        - causal_heuristic_extraction
      additional_tasks_allowed: false
      production_runtime_mutation_allowed: false
      production_controller_role:
        - validate_returned_artifacts
        - integrate_validated_artifacts
    nonlinear_decision_support:
      contract_schema: poke_bot.nonlinear_specialist_decision_support/v1
      validation_receipt_schema: poke_bot.nonlinear_specialist_decision_support_validation/v1
      required_when_deck_complexity_is_nonlinear: true
      sparse_guide_alone_is_sufficient: false
      authoritative_action_path: fused_policy
      required_system_ids:
        - branching_setup_and_pivot
        - attacker_and_engine_preservation
        - typed_energy_and_resource_planning
        - attack_target_and_prize_routing
        - stochastic_disruption_timing
        - bench_and_recovery_routing
        - guide_weight_annealing
      checksum_bound_implementation_artifacts_required: true
      exact_fused_head_inventory_required: true
      causal_current_and_past_state_only: true
      missing_exact_labels_are_masked: true
      training_ineligible_scenario_evaluation_required: true
      preexisting_prestage_receipt_must_be_reissued_after_validation: true
      failure_behavior: block_prestage_and_bootstrap
    specialist_deck_signature_required: true
    causal_public_state_only: true
    hidden_or_future_information_allowed: false
    sparse_high_confidence_targets_only: true
    missing_or_ambiguous_target_behavior: mask
    full_legal_stage_coverage_required: true
    corpus_binding:
      ready_receipt_schema: poke_bot.current_deck_guide_corpus_ready/v1
      selected_expert_manifest_checksum_required: true
      selected_protected_pointer_checksum_required: true
      guide_version_match_required: true
      specialist_identity_match_required: true
      decisions_match_required: true
      nonzero_guide_rows_required: true
      contract_guide_rows_must_equal_selected_manifest_guide_rows: true
      all_daily_shard_checksums_required_before_atomic_promotion: true
      cpu_pack_build_allowed_before_binding_ready: false
      active_training_modification_allowed: false
    action_path_authority: flat_policy
    runtime_action_override_allowed: false
    initial_loss_weight: 0.05
    maximum_loss_weight: 0.05
    bootstrap:
      ramp_epochs: [1, 5]
      ramp_start_weight: 0.01
      ramp_end_weight: 0.05
      hold_through_epoch: 25
    adaptive_annealing:
      enabled_after_bootstrap: true
      statistic: guide_policy_agreement_lift_in_wins_vs_nonwins
      estimator: exponentially_weighted_separate_evaluation
      positive_importance_boundary: 0.0
      hold_when_lower_confidence_bound_above_boundary: true
      decay_when_consecutive_nonpositive_evaluations: 2
      decay_multiplier: 0.8
      minimum_nonzero_weight: 0.005
      zero_weight_when_below_minimum: true
      weight_increase_after_bootstrap_allowed: false
      formal_gate_games_may_tune_weight: false
      training_games_may_tune_weight: false
      calibration_games_training_eligible: false
      calibration_games_replay_eligible: false
      first_second_balance_required: true
      per_matchup_reporting_required: true
      schedule_receipt_required: true
      checkpoint_metrics_require:
        - guide_rows
        - guide_loss
        - guide_policy_agreement
        - win_agreement
        - nonwin_agreement
        - agreement_lift
        - current_weight
    prepared_contracts:
      alakazam: legacy_validated
      hammer-pult: config/deck_guides/hammer-pult.yaml
      marnie-s-grimmsnarl-ex: config/deck_guides/marnie-s-grimmsnarl-ex.yaml
      teal-mask-ogerpon-ex: config/deck_guides/teal-mask-ogerpon-ex.yaml
  matchup_heads:
    required_for_every_specialist: true
    runtime_enabled_by_default_at_specialist_launch: true
    runtime_off_allowed_as_normal_launch_state: false
    automatic_launch_contract_inheritance_required: true
    applies_from_specialist: starmie
    applies_to_all_future_specialists: true
    canonical_roster_required_in_every_checkpoint: true
    canonical_roster_source: state/matchup_adapter_roster.json#/active_expert_ids
    checkpoint_format: poke-bot-matchup-adapter-bank-v6
    adapter_count:
      derivation: fixed_physical_slot_capacity
      physical_slot_capacity: 64
      logical_active_count_derivation: length_of_active_expert_ids
      hard_coded_total_allowed: false
    parameter_expectation:
      derivation: physical_slot_capacity_times_instantiated_per_slot_parameter_count
      per_head_architecture_source: checkpoint_declared_matchup_adapter_config
      hard_coded_total_allowed: false
    active_specialist_route_required: true
    mirror_self_play_route_required: true
    zero_observation_route_remains_materialized: true
    zero_weight_route_remains_routable: true
    maximum_active_routes_per_decision: 1
    causal_observable_state_only: true
    opponent_package_identity_allowed: false
    hidden_or_future_information_allowed: false
    relevant_matchup_sequences_only: true
    unknown_route_falls_back_to_base_policy: true
    freeze_with_owning_specialist: true
    deployment_preflight:
      behavior: fail_closed_before_training
      checkpoint_roster_must_exactly_match_canonical: true
      active_specialist_must_be_in_roster: true
      causal_runtime_must_be_enabled: true
      validated_router_receipt_required: true
      local_and_remote_contract_checksums_must_match: true
    first_self_play_collection_assertion:
      runtime_audit_required: true
      active_specialist_mirror_route_minimum_activations: 1
      failure_behavior: preserve_collection_stop_before_next_iteration
    canonical_roster_migration:
      source: state/matchup_adapter_roster.json
      status: v6_staged_pending_safe_boundary
      live_format_until_activation: poke-bot-matchup-adapter-bank-v5-roster18
      checkpoint_format: poke-bot-matchup-adapter-bank-v6
      physical_slot_capacity: 64
      legacy_v5_prefix_length: 18
      stable_slot_identity_required: true
      roster_change_requires_checkpoint_format_change: false
      retired_slots_are_tombstoned: true
      retired_slot_reuse_allowed: false
      preserve_v5_physical_rows: true
      preserve_v4_physical_rows: false
      retained_rows_preserve_weights_by_route_identity: true
      retained_v5_optimizer_state_preserved_by_parameter_name: true
      unused_slots_exact_zero_and_optimizer_free: true
      activation_boundary: next_safe_receipt_backed_boundary
      live_training_must_not_be_interrupted_for_staging: true
      required_active_route_count_after_activation: 18
      physical_checkpoint_row_count_after_activation: 64
      v5_projection:
        allowed_only_when_no_v6_only_active_or_trained_slot_would_be_lost: true
        otherwise: fail_closed
    meta_crosswalk:
      authoritative_source: state/matchup_adapter_roster.json#/meta_analysis_source
      identity_key: numeric_source_archetype_id
      exact_source_name_guard_required: true
      card_signature_classifier_allowed: true
      fuzzy_display_name_matching_allowed: false
      priority_eligible_statuses: [exact, card_signature]
      non_priority_statuses: [aggregate, ambiguous, missing]
      scope: meta_analysis_and_specialist_priority_only
    dashboard:
      list_complete_canonical_roster: true
      show_zero_observation_routes: true
      distinguish_materialized_runtime_enabled_and_observed: true
      materialized_route_does_not_imply_observed_activation: true
  expanded_strategic_heads:
    schema: poke_bot.expanded_strategic_heads/v1
    target_schema: poke_bot.expanded_strategic_targets/v2
    checkpoint_contract_schema: poke_bot.expanded_head_training/v1
    activation:
      architecture_presence_source: checkpoint_declared_expanded_head_contract
      present_in_current_v5_compatible_learner: true
      present_in_v6_and_later: true
      training_active_from_specialist: dudunsparce
      training_activation: full_model_rl_and_scheduled_expert_rehearsal
      train_every_head_with_valid_causal_labels: true
      zero_valid_label_behavior: mask_without_optimizer_contribution
      current_inflight_iteration_action_path_must_remain_unchanged: true
      pre_fusion_runtime_mode: shadow_only
      flat_policy_authoritative_until_decision_fusion_activation: true
      runtime_enabled_heads: []
      decision_fusion_activation_requires_validated_receipt: true
    heads:
      action_q:
        output: scalar_per_legal_candidate
        selected_target: terminal_monte_carlo_return
        unselected_target_requires_audited_counterfactual_provenance: true
        loss: smooth_l1
        weight: 0.10
      action_type:
        output: scalar_per_legal_candidate
        target_source: canonical_factorized_action_stage_option_type
        loss: masked_cross_entropy
        weight: 0.05
      action_target:
        output: scalar_per_legal_candidate
        target_source: canonical_decoder_target_binding
        loss: masked_cross_entropy
        weight: 0.025
      action_resource:
        output: scalar_per_legal_candidate
        target_source: canonical_decoder_source_tool_energy_binding
        loss: masked_cross_entropy
        weight: 0.025
      action_utility:
        dimensions: [damage_dealt, cards_drawn, energy_delta, open_bench_delta, prize_delta, knockout]
        immediate_post_action_transition_required: true
        loss: masked_smooth_l1_and_bce
        weight: 0.05
      tactical_outcomes:
        horizons_in_same_seat_decision_frames: [1, 2, 3]
        dimensions: [own_prize, opponent_prize, own_knockout, opponent_knockout, net_damage, net_prize]
        loss: masked_bce_and_smooth_l1
        weight: 0.05
      opponent_response:
        interval: after_selected_action_before_next_same_seat_decision
        dimensions: [attack, prize, knockout, active_change, hand_reduction, board_energy_increase, end_without_attack]
        loss: masked_binary_cross_entropy
        weight: 0.05
      resource_forecast:
        target: next_same_seat_decision
        dimensions: [hand_size, deck_size, attached_energy, open_bench_slots, energy_attachment_available, retreat_available]
        loss: masked_smooth_l1_and_bce
        weight: 0.025
      game_phase:
        classes: [setup, stabilize, pressure, prize_race, closeout]
        precedence: [closeout, prize_race, stabilize, setup, pressure]
        unknown_required_fields_are_masked: true
        loss: masked_cross_entropy
        weight: 0.025
      outcome_distribution:
        classes: [loss, draw, win]
        loss: cross_entropy
        diagnostics: [brier_score, expected_calibration_error, entropy]
        weight: 0.05
      remaining_turns:
        target: log1p_remaining_complete_game_turns
        incomplete_or_truncated_trajectory_is_masked: true
        loss: smooth_l1
        weight: 0.025
