  one_shot_authorization_uses: 1
  standing_owner_decision_source: GOAL.md#/decision-ledger/revision-18
  one_shot_authorization_must_bind:
    - specialist_id
    - frozen_checkpoint_checksum
    - submission_file_checksum
    - competition
    - label
  pre_network_authorization_block_behavior: repair_oldest_first_and_continue
  identical_passing_checkpoint_required: true
  clearly_labeled_copies_required: true
  record_submission_ids_timestamps_and_scores: true
  submission_completion_blocks_next_specialist: false
  submission_completion_blocks_all_specialists_baseline_passing: false
  submission_completion_blocks_population_phase: false
  quota_exhaustion_behavior: queue_and_continue
  pending_queue_order: oldest_first
  spacing_wait_behavior: leave_pending_and_continue_training
  next_eligible_time_source: second_most_recent_logical_submission
  submission_time_reconciliation: deduplicate_remote_and_queue_rows_by_submission_id_or_checkpoint_bound_label
  fewer_than_two_prior_logical_submissions_behavior: no_spacing_anchor
  retry_while_quota_exhausted: false
  process_queue_without_interrupting_training: true
  delayed_copy_checkpoint_policy: original_frozen_passing_checkpoint_only
  retrain_or_refreeze_for_delayed_submission: false
  preupload_identity_validation:
    fail_closed: true
    validate_at_build_time: true
    validate_again_immediately_before_upload: true
    specialist_archetype_must_match_checkpoint: true
    model_bytes_must_match_frozen_checkpoint_checksum: true
    deck_must_have_exactly_60_cards: true
    deck_must_match_run_measurement_contract: true
    immutable_queue_identity_fields:
      - specialist_id
      - copy_number
      - turn_order_preference
      - checkpoint_checksum
      - deck_file_checksum
      - deck_cards_checksum
      - representatives_checksum
      - matchup_tree_checksum

