  requires_official_evaluation_completion: true
  official_evaluation_progression_status: measured_gate_required
  requires_measured_premium_gate: true
  freeze_exact_checkpoint: true
  register_checksum: true
  record_reproducibility_metadata: true
  record_complete_holdouts: true
  kaggle_policy_ref: "#/kaggle"
  add_to_public_mix_as_inference_only: true
  begin_next_unfinished_immediately: true
  iteration_floor: 5
  iteration_ceiling: 15
  ceiling_transition:
    allowed: true
    status: ceiling_accepted
    measured_gate_passed: false
    select: exact_ceiling_checkpoint
    preserve_failed_gate_results: true
    freeze_and_register: true
    submit_required_kaggle_copies_or_queue: true
    add_to_public_mix_as_inference_only: true
    begin_next_unfinished_immediately: true
    counts_as_training_complete: true

kaggle:
  daily_submission_limit: 5
  minimum_hours_between_submissions: 4
  required_copies_per_passing_specialist: 1
  default_turn_order_preference: first_if_allowed
  specialist_submission_profiles:
    teal-mask-ogerpon-ex:
      owner_decision_revision: 31
      required_copies: 2
      same_frozen_checkpoint_required: true
      same_exact_60_card_deck_required: true
      copy_profiles:
        - {copy_number: 1, turn_order_preference: first_if_allowed}
        - {copy_number: 2, turn_order_preference: second_if_allowed}
      choice_absent_behavior: continue_without_inventing_turn_order_choice
      submission_completion_blocks_next_specialist: false
  training_milestone_submission_profiles:
    marnie-s-grimmsnarl-ex:
      owner_decision_revision: 107
      zero_indexed_iterations: [0, 4, 9, 14]
      continuing_cadence: every_5n_plus_4_commit_before_completion
      copies_per_milestone: 1
      turn_order_preference: first_if_allowed
      completion_authority: training_milestone_snapshot
      terminal_completion_submission_remains_separate: true
      training_stop_pause_freeze_or_selection_authority: false
      quota_or_spacing_wait_blocks_training: false
  owner_authorized_one_off_submissions:
    alakazam-h10-new-list-no-train-r115:
      owner_decision_revision: 115
      purpose: no_training_deck_list_experiment
      source_specialist_id: alakazam
      source_model_profile: H10-I/v1
