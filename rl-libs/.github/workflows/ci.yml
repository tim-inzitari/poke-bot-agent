name: rl-libs-ci

on:
  push:
    paths: ["rl-libs/**"]
  pull_request:
    paths: ["rl-libs/**"]

jobs:
  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rl-libs
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rl-libs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
