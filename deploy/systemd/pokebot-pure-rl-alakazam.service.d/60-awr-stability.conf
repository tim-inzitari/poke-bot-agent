[Service]
# Iterations 1-3 repeatedly saturated the AWR weight cap (~11% of decisions)
# and regressed the exact Iono holdout from the protected iteration-0 model.
# Keep the two-epoch/two-shard exposure, but soften advantage weighting so one
# replay window cannot take another oversized policy step.
Environment=PURE_RL_AWR_BETA=0.75
Environment=PURE_RL_AWR_WEIGHT_MAX=10.0
