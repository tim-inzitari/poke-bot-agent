[Service]
# Conservative RTX 3080 Ti policy-leaf allocation. Keep GPU1/Blackwell as the
# trainer and primary leaf device; the 12 GiB GPU0 stays below its tested cap.
Environment=PURE_RL_LEAF_GPU0_REPLICAS=10
Environment=PURE_RL_LEAF_GPU0_FRAC=0.3000
Environment=PURE_RL_GPU0_CLIENT_FRAC=0.38
Environment=POKEBOT_LIVE_POOL_MAX_LEAF_GPU0=12
Environment=PURE_RL_SIM_WORKERS=128
Environment=PURE_RL_REBALANCE_MIN_WORKERS=128
Environment=PURE_RL_REBALANCE_MAX_WORKERS=128
# Next-start memory envelope for the 128-worker topology. This keeps 12 GiB
# outside the service for the OS while preventing another host-wide overload.
MemoryHigh=110G
MemoryMax=116G
MemorySwapMax=16G
