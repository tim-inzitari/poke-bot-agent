[Service]
# Remote endpoints add throughput but are not allowed to destroy an otherwise
# valid iteration. Exact jobs are retried and may execute locally when a LAN
# worker is recycling; the formal heldout audit still verifies every game ID,
# checkpoint digest, opponent quota, and seat assignment.
Environment=POKEBOT_REMOTE_REQUIRE_ALL=0
Environment=POKEBOT_REMOTE_NO_LOCAL_FALLBACK=0
