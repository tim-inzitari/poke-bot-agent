[Service]
# GOAL revision 182: keep one extra public request wave queued per remote
# execution worker. Self-play keeps its existing single request wave and
# four-game LibcgMultiEnv transport.
Environment=POKEBOT_REMOTE_DEMAND_QUEUE=1
Environment=POKEBOT_REMOTE_PUBLIC_SOCKET_PREFETCH=2
Environment=POKEBOT_REMOTE_PUBLIC_SOCKET_PREFETCH_MAX=2
Environment="POKEBOT_REMOTE_ENDPOINT_CHUNKS=192.168.1.143:8765=288,192.168.1.158:8766=128"
Environment=POKEBOT_REMOTE_QUEUE_LOW_WATER_FRAC=0.50
Environment=POKEBOT_REMOTE_QUEUE_PROBE_S=2.0

# GOAL's fixed Blackwell contract is exactly 96 local workers / 96 games in
# flight.  Do not let the generic adaptive live-pool plan replace that profile.
Environment=POKEBOT_LIVE_POOL=0

# H10 checkpoint tensors stay resident, but r175 Alakazam must not route or
# backpropagate through combo_state.
Environment=POKEBOT_COMBO_STATE_HEAD_ENABLED=1
Environment=POKEBOT_COMBO_STATE_ROUTE_ENABLED=0
Environment=POKEBOT_COMBO_STATE_ROUTE_SPECIALIST=alakazam
Environment=POKEBOT_COMBO_STATE_ROUTE_CHECKPOINT_DIGEST=sha256:18d8ad2b39fba6639089dc8e5c910c5be064ec11bfc144cbd38baf9645804d12
