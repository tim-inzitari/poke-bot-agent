[Service]
# A new immutable learner must not depend on an interactive desktop GVFS/SMB
# mount.  When that mount is absent, the trainer stages a same-directory
# partial over the authenticated Elmo SSH transport, verifies SHA-256 on Elmo,
# atomically publishes it to this read-only-container bind source, then asks
# the worker's storage-local verifier to prove the digest before reload/pin.
Environment=POKEBOT_ELMO_SSH_STAGE=1
Environment=POKEBOT_ELMO_SSH=admin@192.168.1.143
Environment=POKEBOT_ELMO_SSH_IDENTITY_FILE=/home/inzi/.ssh/id_ed25519_poke_lan
Environment=POKEBOT_ELMO_CHECKPOINT_HOST_DIR=/mnt/Main/Elmo/poke-bot-agent/containers/truenas-worker/checkpoint
Environment=POKEBOT_ELMO_SMB_PROBE_TIMEOUT_S=1
Environment=POKEBOT_ELMO_SSH_STAGE_TIMEOUT_S=900
