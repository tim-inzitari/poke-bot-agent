[Service]
# Use RTP during RL collection when the live sidecar checkpoint exists.
# Missing checkpoint → PolicyAgent falls back to greedy (opt-in when possible).
Environment=POKEBOT_USE_RECURSIVE_TURN_PLANNER=1
Environment=POKEBOT_RTP_CHECKPOINT=/home/inzi/poke-bot-agent/outputs/rtp_fleet/crustle.live/rtp_shadow_planner.pt
Environment=POKEBOT_RTP_SPECIALIST_ID=crustle
Environment=POKEBOT_RTP_SIZING_PROFILE=pure_rl
